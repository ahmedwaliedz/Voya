<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOYA Phase 2 — Layer Reassembly Preview</title>
    <style>
        :root {
            --bg: #f4efe6;
            --panel: #fffdf9;
            --ink: #1a1a1a;
            --muted: #6b645c;
            --line: #ddd4c8;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Georgia, "Times New Roman", serif; color: var(--ink); background: var(--bg); }
        header, main { padding: 24px 32px; }
        header { border-bottom: 1px solid var(--line); background: var(--panel); }
        header h1 { margin: 0 0 8px; font-size: 1.5rem; }
        header p { margin: 0; color: var(--muted); max-width: 72ch; line-height: 1.5; }
        .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
        .controls label { font-size: 0.9rem; color: var(--muted); margin-right: 4px; }
        .controls select, .controls button {
            padding: 8px 12px; border: 1px solid var(--line); background: #fff; cursor: pointer; font: inherit;
        }
        .status { padding: 12px 16px; border-radius: 8px; background: #eef6ea; border: 1px solid #c8ddbf; margin-bottom: 16px; font-size: 0.92rem; }
        .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 24px; }
        .card-head { padding: 16px 18px; border-bottom: 1px solid var(--line); }
        .card-head h2 { margin: 0 0 6px; text-transform: capitalize; }
        .card-head p { margin: 0; color: var(--muted); font-size: 0.92rem; }
        .compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; padding: 16px; }
        .panel { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: #fff; }
        .panel h3 { margin: 0 0 10px; font-size: 0.95rem; }
        .stage-wrap {
            overflow: hidden;
            background: repeating-conic-gradient(#ece7de 0% 25%, #f7f3ec 0% 50%) 50% / 16px 16px;
            border-radius: 6px;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .stage-viewport {
            margin: 0 auto;
            background: var(--bg);
            outline: 1px solid var(--line);
            outline-offset: -1px;
            position: relative;
            overflow: hidden;
        }
        .stage { position: relative; transform-origin: center center; }
        .stage img { position: absolute; top: 0; left: 0; pointer-events: none; user-select: none; max-width: none; }
        .meta { padding: 0 18px 16px; color: var(--muted); font-size: 0.84rem; line-height: 1.45; }
        #capture-label { font-family: monospace; font-size: 0.8rem; color: var(--muted); }
        body.capture-mode header,
        body.capture-mode .controls,
        body.capture-mode .status,
        body.capture-mode #capture-label,
        body.capture-mode .card-head,
        body.capture-mode .meta,
        body.capture-mode .source-panel {
            display: none !important;
        }
        body.capture-mode,
        body.capture-mode main,
        body.capture-mode .card,
        body.capture-mode .compare,
        body.capture-mode .panel {
            margin: 0 !important;
            padding: 0 !important;
            border: 0 !important;
            background: var(--bg) !important;
            overflow: hidden !important;
        }
        body.capture-mode .stage-viewport {
            outline: none !important;
            margin: 0 !important;
        }
        body.capture-mode .compare {
            display: block !important;
        }
    </style>
</head>
<body>
    <header>
        <h1>VOYA Phase 2 — Layer Reassembly Preview</h1>
        <p>CSS transform review for neutral poses, individual layer endpoints, combined stress states, fallback, and reduced motion.</p>
    </header>
    <main>
        <div class="controls" aria-label="Preview controls">
            <label for="character">Character</label>
            <select id="character"><option value="papa">Papa</option><option value="mama">Mama</option><option value="voya">Voya</option></select>
            <label for="layer">Layer</label>
            <select id="layer"><option value="all">All layers</option></select>
            <label for="pose">Pose</label>
            <select id="pose">
                <option value="neutral">Neutral</option>
                <option value="min">Min endpoint</option>
                <option value="max">Max endpoint</option>
                <option value="combined-min">Combined min</option>
                <option value="combined-max">Combined max</option>
                <option value="fallback">Mobile fallback</option>
                <option value="reduced-motion">Reduced motion</option>
            </select>
            <label for="viewport">Viewport</label>
            <select id="viewport">
                <option value="desktop">Desktop 1440×900</option>
                <option value="mobile">Mobile 390×844</option>
            </select>
            <label><input type="checkbox" id="include-shadow"> Shadow</label>
        </div>
        <div class="status" id="status">Loading…</div>
        <div id="capture-label"></div>
        <section class="card" id="card"></section>
    </main>
    <script>
        const VIEWPORTS = {
            desktop: { width: 1440, height: 900 },
            mobile: { width: 390, height: 844 },
        };
        // Keep margin so ±5° serving / ±3° head rotation stays inside the viewport.
        const PAD = 48;

        let manifest = null;
        const params = new URLSearchParams(location.search);

        function qs(id) { return document.getElementById(id); }

        async function loadManifest(name) {
            const res = await fetch(`../../assets/scenes/${name}/manifest.json`);
            if (!res.ok) throw new Error(`Missing manifest for ${name}`);
            return res.json();
        }

        function fitScale(vp) {
            const availW = vp.width - PAD * 2;
            const availH = vp.height - PAD * 2;
            const sx = availW / manifest.sceneCanvas.width;
            const sy = availH / manifest.sceneCanvas.height;
            return Math.min(sx, sy);
        }

        function motionLayers(includeShadow) {
            return manifest.layers.filter((layer) => {
                if (layer.group === 'shadow') return includeShadow;
                return layer.group && layer.group !== 'shadow';
            }).sort((a, b) => a.zIndex - b.zIndex);
        }

        function populateLayerSelect() {
            const select = qs('layer');
            select.innerHTML = '<option value="all">All layers</option>';
            for (const layer of manifest.layers) {
                if (!layer.motion) continue;
                const opt = document.createElement('option');
                opt.value = layer.id;
                opt.textContent = layer.id;
                select.appendChild(opt);
            }
        }

        function rotationForLayer(layerId, pose, layerFilter) {
            const layer = manifest.layers.find((item) => item.id === layerId);
            if (!layer || !layer.motion) return 0;
            const [min, max] = layer.motion.rotate;
            const isCombined = pose === 'combined-min' || pose === 'combined-max';
            const isIndividual = layerFilter !== 'all' && !isCombined;
            if (isIndividual && layerId !== layerFilter) return 0;
            if (pose === 'min' || pose === 'combined-min') return min;
            if (pose === 'max' || pose === 'combined-max') return max;
            return 0;
        }

        function buildStage(viewportKey, pose, layerFilter, includeShadow) {
            const vp = VIEWPORTS[viewportKey];
            const scale = fitScale(vp);
            const outer = document.createElement('div');
            outer.className = 'stage-viewport';
            outer.style.width = `${vp.width}px`;
            outer.style.height = `${vp.height}px`;

            const wrap = document.createElement('div');
            wrap.className = 'stage-wrap';

            const stage = document.createElement('div');
            stage.className = 'stage';
            stage.dataset.character = qs('character').value;
            stage.dataset.viewport = viewportKey;
            stage.dataset.pose = pose;
            stage.dataset.layer = layerFilter;
            stage.dataset.scale = String(scale);
            stage.style.width = `${manifest.sceneCanvas.width}px`;
            stage.style.height = `${manifest.sceneCanvas.height}px`;
            stage.style.transform = `scale(${scale})`;

            // Fallback and reduced-motion share the exact same layered neutral composition
            // (no motion) so they remain pixel-equivalent at the same scale/position.
            const useFallbackAsset = false;
            const isStatic = pose === 'fallback' || pose === 'reduced-motion' || pose === 'neutral';
            const effectivePose = (pose === 'fallback' || pose === 'reduced-motion') ? 'neutral' : pose;

            if (useFallbackAsset && (pose === 'fallback' || pose === 'reduced-motion')) {
                const img = document.createElement('img');
                img.src = `../../assets/scenes/${qs('character').value}/${manifest.mobileFallback}`;
                img.alt = `${qs('character').value} ${pose}`;
                stage.appendChild(img);
            } else {
                for (const layer of motionLayers(includeShadow)) {
                    const img = document.createElement('img');
                    img.src = `../../assets/scenes/${qs('character').value}/${layer.file}`;
                    img.alt = layer.id;
                    img.dataset.layerId = layer.id;
                    img.style.left = `${layer.sceneOffset.x}px`;
                    img.style.top = `${layer.sceneOffset.y}px`;
                    img.style.zIndex = String(layer.zIndex);
                    img.style.transformOrigin = layer.transformOrigin || '50% 50%';
                    const angle = isStatic && (pose === 'fallback' || pose === 'reduced-motion')
                        ? 0
                        : rotationForLayer(layer.id, effectivePose, layerFilter);
                    if (angle) img.style.transform = `rotate(${angle}deg)`;
                    stage.appendChild(img);
                }
            }

            wrap.appendChild(stage);
            outer.appendChild(wrap);
            return outer;
        }

        function captureLabel() {
            const character = qs('character').value;
            const layer = qs('layer').value;
            const pose = qs('pose').value;
            const viewport = qs('viewport').value;
            let filename = `${character}_${layer}_${pose}_${viewport}.png`;
            if (pose === 'fallback') filename = `fallback_${viewport}.png`;
            if (pose === 'reduced-motion') filename = `reduced_motion_${viewport}.png`;
            if (pose === 'neutral' && layer === 'all') filename = `neutral_reconstruction_${viewport}.png`;
            if (layer !== 'all' && pose !== 'fallback' && pose !== 'reduced-motion') {
                filename = `${layer}_${pose}_${viewport}.png`;
            }
            if (pose === 'combined-min' || pose === 'combined-max') {
                filename = `combined_${pose.replace('combined-', '')}_${viewport}.png`;
            }
            qs('capture-label').textContent = `Evidence filename: docs/phase2/evidence/${character}/browser/${filename}`;
            return filename;
        }

        async function render() {
            const status = qs('status');
            const card = qs('card');
            try {
                const captureMode = params.get('capture') === '1';
                if (captureMode) document.body.classList.add('capture-mode');
                if (params.get('character')) qs('character').value = params.get('character');
                if (params.get('viewport')) qs('viewport').value = params.get('viewport');
                if (params.get('pose')) qs('pose').value = params.get('pose');

                const character = qs('character').value;
                manifest = await loadManifest(character);
                populateLayerSelect();
                if (params.get('layer')) qs('layer').value = params.get('layer');

                const pose = qs('pose').value;
                const layer = qs('layer').value;
                const viewport = qs('viewport').value;
                const includeShadow = qs('include-shadow').checked;
                captureLabel();

                card.innerHTML = '';
                if (!captureMode) {
                    card.innerHTML = `
                        <div class="card-head">
                            <h2>${character}</h2>
                            <p>${manifest.source.note}</p>
                        </div>
                    `;
                }
                const compare = document.createElement('div');
                compare.className = 'compare';

                if (!captureMode) {
                    const sourcePanel = document.createElement('div');
                    sourcePanel.className = 'panel source-panel';
                    sourcePanel.innerHTML = '<h3>Approved source reference</h3>';
                    const sourceImg = document.createElement('img');
                    sourceImg.src = `../../assets/scenes/${character}/${manifest.sourceReference}`;
                    sourceImg.alt = `${character} source reference`;
                    sourceImg.style.width = '100%';
                    sourcePanel.appendChild(sourceImg);
                    compare.appendChild(sourcePanel);
                }

                const stackPanel = document.createElement('div');
                stackPanel.className = 'panel';
                if (!captureMode) stackPanel.innerHTML = `<h3>${pose} · ${layer} · ${viewport}</h3>`;
                stackPanel.appendChild(buildStage(viewport, pose, layer, includeShadow));

                compare.appendChild(stackPanel);
                card.appendChild(compare);

                if (!captureMode) {
                    const meta = document.createElement('div');
                    meta.className = 'meta';
                    const scale = fitScale(VIEWPORTS[viewport]);
                    meta.textContent = `Canvas ${manifest.sceneCanvas.width}×${manifest.sceneCanvas.height} · fit scale ${scale.toFixed(4)} · joint expand ${manifest.jointExpandPx}px · blocked: ${(manifest.motionBlocked || []).join(', ') || 'none'}`;
                    card.appendChild(meta);
                }

                status.textContent = `Loaded ${character}. Pose ${pose}. Layer ${layer}. Viewport ${viewport}.`;
                status.dataset.ready = '1';
            } catch (error) {
                status.textContent = `Preview error: ${error.message}`;
                status.dataset.ready = '0';
                throw error;
            }
        }

        ['character', 'layer', 'pose', 'viewport', 'include-shadow'].forEach((id) => {
            qs(id).addEventListener('change', () => { render().catch(() => {}); });
        });

        render().catch(() => {});
    </script>
</body>
</html>
